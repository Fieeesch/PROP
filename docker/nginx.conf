server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /2Dprism-api/ {
        proxy_pass http://prism-2d:8080/;
        proxy_http_version 1.1;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
        client_max_body_size 12m;
    }

    location /cuda-api/ {
        proxy_pass http://prism-cuda:8091/;
        proxy_http_version 1.1;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
        client_max_body_size 12m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
